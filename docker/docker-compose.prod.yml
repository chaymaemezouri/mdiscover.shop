# Production stack for mdiscover.shop (Kamira) — isolated from other projects on the same VPS
services:
  postgres:
    image: postgres:16-alpine
    container_name: kamira-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kamira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kamira_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kamira_cosmetics}
    volumes:
      - kamira_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    # No host ports — internal Docker network only

  redis:
    image: redis:7-alpine
    container_name: kamira-redis-prod
    restart: unless-stopped
    volumes:
      - kamira_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: kamira-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - kamira_minio_data:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: kamira-api-prod
    restart: unless-stopped
    ports:
      - '4010:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kamira}:${POSTGRES_PASSWORD:-kamira_secret}@postgres:5432/${POSTGRES_DB:-kamira_cosmetics}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      APP_URL: ${APP_URL:-https://mdiscover.shop}
      ADMIN_URL: ${ADMIN_URL:-https://mdiscover.shop}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.mdiscover.shop}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kamira-assets}
      # Must be browser-reachable (API proxies MinIO at /uploads/*)
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://api.mdiscover.shop/uploads}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@mdiscover.shop}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mdiscover.shop/api/v1}
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://mdiscover.shop}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-212661528608}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_SHOW_DEMO_LOGIN: ${NEXT_PUBLIC_SHOW_DEMO_LOGIN:-false}
        ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://kamira-admin-prod:3001}
    container_name: kamira-web-prod
    restart: unless-stopped
    ports:
      - '3010:3000'
    environment:
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://kamira-admin-prod:3001}
    depends_on:
      - api
      - admin

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-https://api.mdiscover.shop/api/v1}
        NEXT_PUBLIC_STORE_URL: ${APP_URL:-https://mdiscover.shop}
    container_name: kamira-admin-prod
    restart: unless-stopped
    ports:
      - '3012:3001'
    depends_on:
      - api

volumes:
  kamira_postgres_data:
  kamira_redis_data:
  kamira_minio_data:
